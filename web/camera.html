<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>ArgoNVR - Camera Stream</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="camera.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const setAppHeight = () => {
            // Use visualViewport if available, as it accurately tracks mobile screen boxes post-bfcache
            const height = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            document.documentElement.style.setProperty('--app-height', `${height}px`);
        };

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setAppHeight);
            window.visualViewport.addEventListener('scroll', setAppHeight);
        }

        window.addEventListener('resize', setAppHeight);

        window.addEventListener('pageshow', (event) => {
            // Force height recalculation after a frame settles when coming out of bfcache
            requestAnimationFrame(() => {
                setAppHeight();
                setTimeout(setAppHeight, 100);
            });
        });

        setAppHeight();
    </script>
</head>
<body>
<div class="camera-header">
    <button class="back-btn" onclick="window.location.href='index.html'">◀ Back</button>
    <span id="cam-title" class="cam-title">CAM</span>
</div>

<div class="video-container">
    <canvas id="snapshot-canvas" class="snapshot-canvas"></canvas>
    <video id="fw-video" muted playsinline preload="auto"></video>

    <div class="no-video-overlay" id="fw-overlay" style="z-index: 10;">
        <div>No Motion Detected / Stream Offline</div>
    </div>
</div>

<div class="fw-timeline-bar" id="fw-timeline-bar">
    <div class="fw-timeline-container">
        <div class="fw-timeline-region" id="fw-timeline-region" title="Sweep across recorded clips">
            <div class="fw-timeline-indicator" id="fw-timeline-indicator"></div>
        </div>
    </div>
</div>

<div class="fw-controls" id="fw-controls">
    <button class="ctrl-btn live-btn" id="fw-btn-live" onclick="fwGoLive()">Go Live</button>
    <div class="fw-time-display" id="fw-time-label">LIVE</div>

    <select id="fw-scale-select" class="ctrl-btn ctrl-select" onchange="handleScaleChange()">
        <option value="1" selected>1 Hour</option>
        <option value="2">2 Hours</option>
        <option value="4">4 Hours</option>
        <option value="6">6 Hours</option>
        <option value="8">8 Hours</option>
        <option value="12">12 Hours</option>
        <option value="all">Full Day</option>
        <option value="custom" hidden>Custom</option>
    </select>

    <div class="slider-group">
        <label>Start: <span id="start-val">00:00</span></label>
        <input type="range" id="fw-start-slider" min="0" max="86400" step="60" value="0">
    </div>
    <div class="slider-group">
        <label>End: <span id="end-val">NOW</span></label>
        <input type="range" id="fw-end-slider" min="0" max="86400" step="60" value="86400">
    </div>
</div>

<script src="camera.js"></script>
</body>
</html>
